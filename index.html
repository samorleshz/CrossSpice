<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b3d91">
<meta name="description" content="Editor y simulador de circuitos compatible con LTspice, para tabletas.">
<title>CrossSpice</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app">
  <header id="topbar">
    <button id="btn-menu" class="tb" title="Archivo"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg><span>Archivo</span></button>
    <div id="docname" title="Nombre del archivo">Sin título.asc</div>
    <button id="btn-undo" class="tb" title="Deshacer"><svg viewBox="0 0 24 24"><path d="M9 7L4 12l5 5M4 12h10a6 6 0 0 1 0 12"/></svg><span>Deshacer</span></button>
    <button id="btn-redo" class="tb" title="Rehacer"><svg viewBox="0 0 24 24"><path d="M15 7l5 5-5 5M20 12H10a6 6 0 0 0 0 12"/></svg><span>Rehacer</span></button>
    <button id="btn-fit" class="tb" title="Ver todo el circuito"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg><span>Ajustar</span></button>
    <button id="btn-analysis" class="tb wide" title="Comando de simulación"><span id="analysis-label">.tran</span><span>Análisis</span></button>
    <button id="btn-run" class="tb run" title="Simular" disabled><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg><span>Simular</span></button>
  </header>

  <main id="main">
    <svg id="schematic" data-mode="select"></svg>
    <div id="hint"></div>
    <section id="results" hidden>
      <div id="results-grip" title="Arrastre para cambiar el tamaño"></div>
      <div id="results-bar">
        <span id="results-title">Resultados</span>
        <button id="btn-probe" class="chip active">Sonda</button>
        <button id="btn-clear-traces" class="chip">Borrar trazas</button>
        <button id="btn-close-results" class="chip">Cerrar</button>
      </div>
      <canvas id="plot"></canvas>
      <div id="optable" hidden></div>
    </section>
  </main>

  <nav id="toolbar">
    <button class="tool active" data-tool="select" title="Seleccionar, mover y editar"><svg viewBox="0 0 32 32"><path d="M8 4v20l5-5 4 9 3-1-4-9h7z"/></svg><span>Elegir</span></button>
    <button class="tool" data-tool="wire" title="Cable"><svg viewBox="0 0 32 32"><path d="M4 26V12h24V6"/><circle cx="4" cy="26" r="2.5"/><circle cx="28" cy="6" r="2.5"/></svg><span>Cable</span></button>
    <button class="tool" data-tool="ground" title="Tierra"><svg viewBox="0 0 32 32"><path d="M16 4v10M6 14h20L16 26z"/></svg><span>Tierra</span></button>
    <button class="tool" data-tool="label" title="Etiqueta de red"><svg viewBox="0 0 32 32"><path d="M16 28v-8"/><text x="16" y="15" text-anchor="middle" font-size="12" font-weight="700">out</text></svg><span>Etiqueta</span></button>
    <button class="tool" data-tool="res" title="Resistencia"><svg viewBox="0 0 32 32"><path d="M2 16h5l2-6 4 12 4-12 4 12 4-12 2 6h3"/></svg><span>R</span></button>
    <button class="tool" data-tool="cap" title="Capacitor"><svg viewBox="0 0 32 32"><path d="M2 16h11M13 6v20M19 6v20M19 16h11"/></svg><span>C</span></button>
    <button class="tool" data-tool="ind" title="Inductor"><svg viewBox="0 0 32 32"><path d="M1 18h3a3 3 0 0 1 6 0a3 3 0 0 1 6 0a3 3 0 0 1 6 0a3 3 0 0 1 6 0h3"/></svg><span>L</span></button>
    <button class="tool" data-tool="diode" title="Diodo"><svg viewBox="0 0 32 32"><path d="M2 16h8M10 7v18l14-9zM24 7v18M24 16h6"/></svg><span>D</span></button>
    <button class="tool" data-tool="voltage" title="Fuente de voltaje"><svg viewBox="0 0 32 32"><circle cx="16" cy="16" r="11"/><path d="M16 9v7M12.5 12.5h7M12.5 21h7"/></svg><span>V</span></button>
    <button class="tool" data-tool="component" title="Otro componente de la librería"><svg viewBox="0 0 32 32"><rect x="8" y="5" width="16" height="22" rx="1"/><path d="M3 10h5M3 16h5M3 22h5M24 10h5M24 16h5M24 22h5"/></svg><span>Comp.</span></button>
    <button class="tool act" data-tool="rotate" title="Rotar"><svg viewBox="0 0 32 32"><path d="M24 8a11 11 0 1 0 3 9"/><path d="M25 2v7h-7"/></svg><span>Rotar</span></button>
    <button class="tool act" data-tool="mirror" title="Espejo"><svg viewBox="0 0 32 32"><path d="M16 3v26" stroke-dasharray="3 3"/><path d="M12 8L4 24h8zM20 8l8 16h-8z"/></svg><span>Espejo</span></button>
    <button class="tool" data-tool="delete" title="Borrar"><svg viewBox="0 0 32 32"><path d="M6 9h20M12 9V5h8v4M8 9l2 19h12l2-19M13 13v11M19 13v11"/></svg><span>Borrar</span></button>
  </nav>
</div>

<div id="splash">
  <img src="icons/icon-192.png" alt="" width="96" height="96">
  <h1>CrossSpice</h1>
  <p id="splash-status">Iniciando…</p>
  <div class="bar"><div id="splash-bar"></div></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>

<input type="file" id="file-asc" accept=".asc,.ASC,text/plain" hidden>
<input type="file" id="file-zip" accept=".zip,application/zip" hidden>

<script type="module" src="app.js"></script>
</body>
</html>
